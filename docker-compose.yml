version: '3.8'

services:
  # Frontend Service (React + Vite)
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - averqon-network

  # Backend Service (Node.js + Compilers)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/averqonlearn}
      - JWT_SECRET=${JWT_SECRET:-averqon_secret_key}
      - NODE_ENV=production
    depends_on:
      - mongo
    networks:
      - averqon-network
    volumes:
      - ./server/temp:/app/temp

  # Database Service (MongoDB) - Optional if using Atlas
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - averqon-network

networks:
  averqon-network:
    driver: bridge

volumes:
  mongo_data:
